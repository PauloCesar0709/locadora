spring.application.name=aluguel-carros
server.port=8080

# Lê variáveis de um arquivo .env na pasta backend (opcional). Veja .env.example
spring.config.import=optional:file:.env[.properties]

# Banco de dados: Supabase (PostgreSQL)
spring.datasource.url=${SUPABASE_DB_URL}
spring.datasource.username=${SUPABASE_DB_USER}
spring.datasource.password=${SUPABASE_DB_PASSWORD}

# O schema é criado pelos scripts da pasta /database (nunca pelo Hibernate)
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# JWT (o segredo precisa ter pelo menos 32 caracteres)
app.jwt.secret=${JWT_SECRET}
app.jwt.expiracao-minutos=120

# CORS: origem(ns) do front-end, separadas por vírgula
app.cors.origem-permitida=${CORS_ORIGENS:http://localhost:5173}
